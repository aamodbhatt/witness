<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>witness</title>
<style>
  body { margin: 0; width: 300px; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
         color: #1d1d1f; background: #fbfaf7; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 6px; }
  h1 { font-size: 17px; margin: 0; letter-spacing: -0.01em; }
  .status { color: #6b6b70; font-size: 12.5px; padding: 0 16px 10px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 0 16px 14px; }
  .tile { background: #fff; border: 1px solid #e6e3dc; border-radius: 10px; padding: 8px 10px; }
  .tile b { display: block; font-size: 22px; line-height: 1.2; }
  .tile span { font-size: 11.5px; color: #6b6b70; }
  .ok b { color: #1a7f4b; } .bad b { color: #c62828; } .meh b { color: #7d7d82; }
  footer { border-top: 1px solid #e6e3dc; padding: 10px 16px; display: flex; justify-content: space-between; font-size: 12.5px; }
  a { color: #1d1d1f; }
  label.switch { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 12.5px; }
</style>
</head>
<body>
  <header>
    <h1>witness</h1>
    <label class="switch"><input id="enabled" type="checkbox"> on</label>
  </header>
  <div class="status" id="status">Connecting…</div>
  <div class="grid">
    <div class="tile ok"><b id="supported">–</b><span>supported</span></div>
    <div class="tile bad"><b id="refuted">–</b><span>refuted</span></div>
    <div class="tile meh"><b id="unverifiable">–</b><span>can't tell</span></div>
  </div>
  <footer>
    <span id="server">server: –</span>
    <a href="#" id="options">settings</a>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
