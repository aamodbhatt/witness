[project]
name = "witness"
version = "0.1.0"
description = "A local fact-checker that underlines every claim on a webpage: entity linking + BM25 over Wikipedia, cross-encoder evidence ranking and a fine-tuned DeBERTa-v3 verifier."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aamod Bhatt" }]
requires-python = ">=3.12,<3.13"
keywords = ["fact-checking", "fever", "retrieval", "nli", "wikipedia", "browser-extension"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "torch==2.14.1",
  "transformers>=4.56",
  "sentencepiece>=0.2",
  "protobuf>=5.28",
  "snowballstemmer>=3.0",
  "numpy>=2.1",
  "scipy>=1.14",
  "beautifulsoup4>=4.12",
  "pydantic>=2.9",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.28",
  "typer>=0.15",
]

[project.scripts]
witness = "witness.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "hypothesis>=6.120",
  "ruff>=0.8",
  "mypy>=1.13",
  "bm25s>=0.2.13",
]
browser = ["playwright>=1.49"]
docs = ["matplotlib>=3.9", "pillow>=11", "playwright>=1.49"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/witness"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH", "C4", "PIE", "RET", "TID", "PL"]
# PLR0913/PLR0917: Typer commands declare every CLI option as a parameter.
ignore = ["PLR0913", "PLR0917", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "PLC0415", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["bm25s.*", "snowballstemmer.*", "scipy.*", "playwright.*", "matplotlib.*", "PIL.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers -m 'not browser'"
markers = [
  "browser: drives the unpacked extension in headless Chromium (needs `playwright install chromium`)",
]
filterwarnings = ["ignore::DeprecationWarning:bm25s.*"]
