name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # CPU-only torch keeps the install small; the code paths are device-agnostic.
      UV_TORCH_BACKEND: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install (CPU torch)
        run: |
          sed -i 's#https://download.pytorch.org/whl/cu130#https://download.pytorch.org/whl/cpu#' pyproject.toml
          uv sync --group browser
      - name: Lint
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts
      - name: Type-check
        run: uv run mypy src tests scripts
      - name: Unit and integration tests
        run: uv run pytest -q
      - name: Extension in headless Chromium
        run: |
          uv run playwright install --with-deps chromium
          uv run pytest -q -m browser
